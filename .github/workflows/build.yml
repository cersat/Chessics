name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" > /dev/null

      - name: Cache Stockfish nets
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/*.nnue
          key: nnue-1c0000000000-37f18f62d772

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleFullRelease assembleFdroidRelease

      - name: Rename
        id: v
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "version=$V" >> $GITHUB_OUTPUT
          cp app/build/outputs/apk/full/release/app-full-release.apk Chessics-$V.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Chessics-${{ steps.v.outputs.version }}
          path: Chessics-*.apk

      - name: Remove old APKs from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api repos/${{ github.repository }}/releases/tags/latest -q '.assets[].id' 2>/dev/null); do
            gh api -X DELETE repos/${{ github.repository }}/releases/assets/$id
          done

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Chessics ${{ steps.v.outputs.version }}
          make_latest: true
          files: Chessics-*.apk
